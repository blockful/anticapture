[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/monitoring/Dockerfile.railway-exporter"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.pr.deploy]
startCommand = "echo 'NOOP'"
healthcheckPath = ""
preDeployCommand = ""
