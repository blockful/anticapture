templates:
  - /etc/alertmanager/slack.tmpl

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    # ponytail: only the cache-hit-rate alert is this chatty — it tracks a baseline
    # that sits near the threshold, so re-pinging hourly turns one ongoing condition
    # into a wall of identical Slack messages. Other warnings (ErpcNodefulNoTraffic,
    # IndexerSyncStale, PostgreSQLHighConnections) still repeat hourly; widen this
    # matcher per alertname if one of them proves noisy too.
    - matchers: [alertname="ErpcCacheHitRateLow"]
      receiver: default
      repeat_interval: 12h

receivers:
  - name: default
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "${SLACK_CHANNEL}"
        color: '{{ template "slack.anticapture.color" . }}'
        title: '{{ template "slack.anticapture.title" . }}'
        text: '{{ template "slack.anticapture.text" . }}'
        send_resolved: true
