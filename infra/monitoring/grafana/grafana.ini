[server]
# The http port to use
http_port = 3000

[dashboards]
# Minimum dashboard refresh interval. When set, this will restrict users to set the refresh interval of a dashboard lower than given interval. Per default this is 5 seconds.
# The interval string is a possibly signed sequence of decimal numbers, followed by a unit suffix (ms, s, m, h, d), e.g. 30s or 1m.
min_refresh_interval = 500ms

[auth.google]
# Every login gets the org Admin role. Sign-in is already restricted to the
# Blockful Google Workspace, so this grants Admin to all @blockful.io accounts.
# Re-evaluated on each login, so existing accounts are upgraded when they next
# sign in. Anything outside the domain falls back to Viewer.
role_attribute_path = ends_with(email, '@blockful.io') && 'Admin' || 'Viewer'
