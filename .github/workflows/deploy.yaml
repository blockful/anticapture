name: Deploy

on:
  push:
    branches: [main, dev]

# Only the latest push per branch matters; cancel superseded deploys.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Vercel (${{ github.ref_name == 'main' && 'production' || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the DAO API commit resolved below can be many
          # releases back, and a shallow clone would silently resolve to
          # nothing and skip the gate.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve commit author
        id: author
        run: echo "name=$(git log -1 --format='%an')" >> "$GITHUB_OUTPUT"

      # Gateful merges its upstreams' OpenAPI specs into its own on every
      # /docs/json request, so waiting on gateful's commit alone is not enough:
      # gateful can be up-to-date while a DAO API, the relayer or address
      # enrichment (slower, separately watched builds) still serves the
      # previous spec.
      - name: Resolve the commits each upstream should be serving
        id: upstreams
        run: |
          set -euo pipefail
          # For each service whose OpenAPI gateful merges into /docs/json: the
          # commits strictly older than the newest one that touched the paths
          # Railway watches to rebuild it — "still the previous release".
          # First-parent, because that is the diff Railway itself sees for a
          # push to this branch.
          #
          # A reject list rather than an accept list so that a commit newer
          # than this run also passes: Railway stamps a service with the head
          # of the push that rebuilt it, and a push that lands while we wait
          # would otherwise be unreachable and block until the timeout.
          #
          # Deliberately not "did THIS push change the service": a push that
          # leaves it alone while an earlier push is still deploying it would
          # answer "no" and skip the gate while the old spec is still served.
          #
          # ponytail: 200-push window — a service more than 200 pushes behind
          # reads as newer and passes. Compare ancestry via the API if that
          # ever matters.
          older() {
            git rev-list --first-parent -n 201 "$1" | tail -n +2 | paste -sd, -
          }
          last() { git log --first-parent -1 --format=%H -- "$@"; }
          shas=$(jq -cn \
            --arg dao "$(older "$(last apps/api infra/api)")" \
            --arg relayer "$(older "$(last apps/relayer infra/relayer)")" \
            --arg enrichment "$(older "$(last apps/address-enrichment infra/address-enrichment)")" \
            '{"dao-api": ($dao | split(",")),
              "relayer": ($relayer | split(",")),
              "address-enrichment": ($enrichment | split(","))}')
          echo "stale=${shas}" >> "$GITHUB_OUTPUT"
          echo "stale-gateful=$(older HEAD)" >> "$GITHUB_OUTPUT"
          echo "${shas}" | jq -r 'to_entries[] | "\(.key) must be newer than \(.value[0])"'

      # `vercel deploy` builds the dashboard, which runs @anticapture/client
      # codegen against the live gateful spec. Wait for gateful to serve this
      # exact commit first, or codegen races the redeploy and fails with
      # "fetch failed" (same rationale as tests.yaml's wait-for-gateful job).
      - name: Wait for gateful to be ready
        run: node scripts/wait-for-gateful.mjs
        env:
          ANTICAPTURE_API_URL: ${{ secrets.GATEFUL_URL }}
          EXPECTED_GATEFUL_SHA: ${{ github.sha }}
          STALE_UPSTREAM_SHAS: ${{ steps.upstreams.outputs.stale }}
          STALE_GATEFUL_SHAS: ${{ steps.upstreams.outputs.stale-gateful }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROD_FLAG: ${{ github.ref_name == 'main' && '--target=production' || '--target=dev' }}
          GATEFUL_URL: ${{ secrets.GATEFUL_URL }}
          USER_API_URL: ${{ secrets.USER_API_URL }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
          GIT_MSG: ${{ github.event.head_commit.message }}
          GIT_AUTHOR_LOGIN: ${{ github.actor }}
          GIT_AUTHOR_NAME: ${{ steps.author.outputs.name }}
          GIT_ORG: ${{ github.repository_owner }}
          GIT_REPO: ${{ github.event.repository.name }}
          GIT_REPO_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          # USER_API_URL feeds the dashboard's /api/user proxy (runtime-only).
          # Passed only when the secret exists so an unset secret falls back
          # to the Vercel project's own env instead of overriding it with "".
          EXTRA_ENV=()
          if [ -n "${USER_API_URL}" ]; then
            EXTRA_ENV+=(--env USER_API_URL="${USER_API_URL}")
          fi
          npx --yes vercel@latest deploy --yes ${PROD_FLAG} --token="${VERCEL_TOKEN}" \
            --build-env ANTICAPTURE_API_URL="${GATEFUL_URL}" \
            --env ANTICAPTURE_API_URL="${GATEFUL_URL}" \
            "${EXTRA_ENV[@]}" \
            --meta githubCommitSha="${GIT_SHA}" \
            --meta githubCommitRef="${GIT_REF}" \
            --meta githubCommitMessage="${GIT_MSG%%$'\n'*}" \
            --meta githubCommitAuthorLogin="${GIT_AUTHOR_LOGIN}" \
            --meta githubCommitAuthorName="${GIT_AUTHOR_NAME}" \
            --meta githubCommitOrg="${GIT_ORG}" \
            --meta githubCommitRepo="${GIT_REPO}" \
            --meta githubCommitRepoId="${GIT_REPO_ID}" \
            --meta githubOrg="${GIT_ORG}" \
            --meta githubRepo="${GIT_REPO}" \
            --meta githubRepoId="${GIT_REPO_ID}" \
            --meta githubDeployment=1
